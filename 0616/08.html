<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <--!jQuery library 추가-->
    <script src ="https://code.jquery.com/jquery-4.0.0.js"></script>
    <!-- jQuery 문법으로 코드 작성 --->
     <script>
      $(document).ready(
         function(){
           $(document).css("background-color","black");
              
           $("#box").css({
            width:"100px",
            height:"100px",
            background:"orange",
            position:"absolute",
            top:"10px",
            left:"10px"

           }
          ).animate({
            width:"300px",
            opacity:0.2

           },2000
          ).animate({
            opacity:1,
            left:"100px",
            top:"100px"
           },2000
          );
           
          }
             );
      
     </script>
     

    
</head>
<body>
   <div id = "box"></div>
</body>
</html>
